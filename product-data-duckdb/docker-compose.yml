services:
  postgres:
    image: postgres:16-alpine
    container_name: duckdb-product-pipeline-postgres
    environment:
      POSTGRES_DB: duckdb_tutorial
      POSTGRES_USER: duckdb
      POSTGRES_PASSWORD: duckdb
    ports:
      - "55433:5432"
    volumes:
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U duckdb -d duckdb_tutorial"]
      interval: 2s
      timeout: 3s
      retries: 20

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    container_name: duckdb-product-pipeline-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 2s
      timeout: 3s
      retries: 20

  minio-seed:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    depends_on:
      minio:
        condition: service_healthy
    volumes:
      - ./output:/data/output:ro
    entrypoint: ["/bin/sh", "-c"]
    command: >
      "mc alias set local http://minio:9000 minioadmin minioadmin &&
       mc mb --ignore-existing local/duckdb-tutorial &&
       mc mirror --overwrite /data/output/products_by_category local/duckdb-tutorial/products_by_category &&
       mc mirror --overwrite /data/output/products_by_ingest_date local/duckdb-tutorial/products_by_ingest_date"
